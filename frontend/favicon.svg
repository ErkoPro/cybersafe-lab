<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100" height="100" fill="#071427" rx="20"/>
  
  <path d="M50 15 L30 25 L30 45 C30 60 40 70 50 75 C60 70 70 60 70 45 L70 25 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.9" 
        filter="url(#glow)"/>
  
  <rect x="42" y="50" width="16" height="20" rx="2" 
        fill="url(#lockGrad)" 
        opacity="0.95" 
        filter="url(#glow)"/>
  
  <circle cx="50" cy="58" r="3" fill="#071427"/>
  
  <circle cx="30" cy="30" r="2" fill="#06b6d4" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="70" cy="30" r="2" fill="#7c3aed" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="50" cy="25" r="1.5" fill="#06b6d4" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>

