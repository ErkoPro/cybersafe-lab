<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Engineering Awareness Trainer — CyberSafe Lab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #071427;
      --bg-dark: #061026;
      --card: #0b1221;
      --accent: #06b6d4;
      --accent2: #7c3aed;
      --muted: #9aa4b2;
      --text: #e6eef8;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --border: rgba(255, 255, 255, 0.03);
      --shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #071427;
      color: var(--text);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #071427, #0a1b35, #061026, #0d1f3a);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      z-index: -3;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
      animation: pulse 8s ease-in-out infinite;
      z-index: -2;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(6, 182, 212, 0.3);
      animation: float 20s infinite ease-in-out;
    }

    .particle:nth-child(1) { width: 4px; height: 4px; left: 10%; animation-delay: 0s; animation-duration: 15s; }
    .particle:nth-child(2) { width: 6px; height: 6px; left: 20%; animation-delay: 2s; animation-duration: 18s; }
    .particle:nth-child(3) { width: 3px; height: 3px; left: 30%; animation-delay: 4s; animation-duration: 20s; }
    .particle:nth-child(4) { width: 5px; height: 5px; left: 40%; animation-delay: 1s; animation-duration: 16s; }
    .particle:nth-child(5) { width: 4px; height: 4px; left: 50%; animation-delay: 3s; animation-duration: 19s; }
    .particle:nth-child(6) { width: 6px; height: 6px; left: 60%; animation-delay: 5s; animation-duration: 17s; }
    .particle:nth-child(7) { width: 3px; height: 3px; left: 70%; animation-delay: 2.5s; animation-duration: 21s; }
    .particle:nth-child(8) { width: 5px; height: 5px; left: 80%; animation-delay: 4.5s; animation-duration: 18s; }
    .particle:nth-child(9) { width: 4px; height: 4px; left: 90%; animation-delay: 1.5s; animation-duration: 16s; }
    .particle:nth-child(10) { width: 6px; height: 6px; left: 15%; animation-delay: 3.5s; animation-duration: 22s; }

    @keyframes float {
      0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) translateX(100px) scale(1); opacity: 0; }
    }

    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
      animation: gridMove 20s linear infinite;
      opacity: 0.5;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 30px;
      transition: all 0.2s;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .warning-banner {
      display: inline-block;
      padding: 12px 24px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      color: var(--warning);
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 16px;
    }

    /* Scenario Card */
    .scenario-card {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(124, 58, 237, 0.05));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 32px;
    }

    .scenario-card h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--text);
    }

    .scenario-text {
      background: rgba(0, 0, 0, 0.3);
      border-left: 4px solid var(--warning);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--text);
    }

    .scenario-text::before {
      content: '📞';
      font-size: 1.5rem;
      margin-right: 12px;
    }

    /* Response Options */
    .responses-grid {
      display: grid;
      gap: 16px;
      margin-bottom: 32px;
    }

    .response-btn {
      background: rgba(0, 0, 0, 0.2);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: left;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
    }

    .response-btn:hover {
      border-color: var(--accent);
      background: rgba(6, 182, 212, 0.1);
      transform: translateX(4px);
    }

    /* Result Section */
    .result-section {
      display: none;
      margin-top: 32px;
      animation: fadeInUp 0.8s ease-out;
    }

    .result-section.visible {
      display: block;
    }

    .result-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .result-card.correct {
      border-left: 4px solid var(--success);
      background: rgba(16, 185, 129, 0.1);
    }

    .result-card.incorrect {
      border-left: 4px solid var(--error);
      background: rgba(239, 68, 68, 0.1);
    }

    .result-card h3 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .result-card p {
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 12px;
    }

    .red-flags {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .red-flags h4 {
      color: var(--error);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .red-flags ul {
      list-style: none;
      padding: 0;
    }

    .red-flags li {
      padding: 8px 0;
      padding-left: 24px;
      position: relative;
      color: var(--muted);
    }

    .red-flags li::before {
      content: '⚠️';
      position: absolute;
      left: 0;
    }

    .correct-actions {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .correct-actions h4 {
      color: var(--success);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .correct-actions ul {
      list-style: none;
      padding: 0;
    }

    .correct-actions li {
      padding: 8px 0;
      padding-left: 24px;
      position: relative;
      color: var(--muted);
    }

    .correct-actions li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: var(--success);
      font-weight: 700;
    }

    .btn-next {
      padding: 14px 32px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: var(--shadow);
      margin-top: 24px;
    }

    .btn-next:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(2, 6, 23, 0.8);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 20px 12px;
      }

      .back-link {
        padding: 8px 16px;
        font-size: 0.9rem;
        margin-bottom: 20px;
      }

      .header {
        margin-bottom: 28px;
      }

      .header h1 {
        font-size: 1.75rem;
        line-height: 1.2;
      }

      .header .subtitle {
        font-size: 0.95rem;
      }

      .scenario-card {
        padding: 20px 16px;
        margin-bottom: 20px;
      }

      .scenario-card h2 {
        font-size: 1.3rem;
      }

      .scenario-content {
        font-size: 0.9rem;
      }

      .btn {
        padding: 14px 24px;
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      .container {
        padding: 16px 8px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .scenario-card {
        padding: 18px 14px;
      }
    }

    @media (max-width: 360px) {
      .header h1 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="animated-bg">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  <div class="grid-overlay"></div>
  <div class="container">
    <a href="/" class="back-link">← Назад на главную</a>

    <header class="header">
      <h1>🎭 Social Engineering Awareness Trainer</h1>
      <div class="warning-banner">
        ⚠️ ТОЛЬКО ДЛЯ ОБРАЗОВАТЕЛЬНЫХ ЦЕЛЕЙ
      </div>
    </header>

    <div id="scenarioContainer">
      <!-- Scenarios will be loaded here -->
    </div>
  </div>

  <script>
    const scenarios = [
      {
        id: 1,
        title: 'Звонок от "службы безопасности банка"',
        text: 'Вам звонят и говорят: "Ваш аккаунт заблокирован из-за подозрительной активности. Срочно подтвердите данные: номер карты, CVV и код из SMS для разблокировки."',
        responses: [
          {
            text: 'Выполнить требуемое и предоставить данные',
            correct: false,
            explanation: 'НИКОГДА не предоставляйте данные карты или коды из SMS по телефону. Настоящие банки никогда не просят такие данные по телефону.',
            redFlags: [
              'Срочность и давление',
              'Запрос конфиденциальных данных по телефону',
              'Угроза блокировки аккаунта',
              'Требование кода из SMS'
            ],
            correctActions: [
              'Завершите разговор',
              'Позвоните в банк по официальному номеру',
              'Проверьте статус аккаунта через официальное приложение',

            ]
          },
          {

            correct: true,
            explanation: 'Правильно! Задавайте вопросы: "Какой номер карты у меня на счету?", "Какой мой адрес регистрации?" Мошенники не знают эти данные.',
            redFlags: [
              'Настоящие сотрудники знают ваши данные',
              'Мошенники не смогут ответить на проверочные вопросы'
            ],
            correctActions: [
              'Задайте проверочные вопросы',
              'Попросите номер обращения',
              'Позвоните в банк самостоятельно по официальному номеру',
              'Не сообщайте данные, даже если кажется убедительно'
            ]
          },
          {
            text: 'Завершить разговор и перезвонить в банк',
            correct: true,
            explanation: 'Отлично! Это самый безопасный вариант. Всегда звоните в банк самостоятельно по номеру с официального сайта.',
            redFlags: [
              'Настоящие банки не звонят с просьбой данных',
              'Всегда нужно перезванивать по официальному номеру'
            ],
            correctActions: [
              'Завершите разговор немедленно',
              'Найдите официальный номер на сайте банка',
              'Позвоните самостоятельно',
              'Проверьте статус аккаунта через официальные каналы'
            ]
          }
        ]
      },
      {
        id: 2,
        title: '"Ваш родственник попал в аварию"',
        text: 'Вам звонят и говорят: "Ваш [родственник] попал в аварию, срочно нужны деньги на лечение. Переведите деньги на этот счет немедленно!"',
        responses: [
          {
            text: 'Немедленно перевести деньги',
            correct: false,
            explanation: 'Это классическая схема мошенничества. Никогда не переводите деньги под давлением, не проверив информацию.',
            redFlags: [
              'Эмоциональное давление',
              'Срочность и требование немедленных действий',
              'Просьба перевести деньги на незнакомый счет',
              'Невозможность связаться с родственником'
            ],
            correctActions: [
              'Не переводите деньги немедленно',
              'Попробуйте связаться с родственником напрямую',
              'Проверьте информацию через других членов семьи',
              'Если сомневаетесь, обратитесь в полицию'
            ]
          },
          {
            text: 'Попытаться связаться с родственником',
            correct: true,
            explanation: 'Правильно! Всегда проверяйте информацию напрямую. Мошенники создают ситуацию, когда вы не можете проверить факты.',
            redFlags: [
              'Мошенники мешают вам проверить информацию',
              'Создают искусственную срочность'
            ],
            correctActions: [
              'Позвоните родственнику напрямую',
              'Свяжитесь с другими членами семьи',
              'Не поддавайтесь панике',
              'Проверьте все факты перед действиями'
            ]
          },
          {
            text: 'Завершить разговор и проверить информацию',
            correct: true,
            explanation: 'Отлично! Никогда не принимайте важные финансовые решения под давлением. Всегда проверяйте информацию.',
            redFlags: [
              'Настоящие экстренные ситуации не требуют немедленного перевода денег',
              'Медицинские учреждения не просят деньги по телефону'
            ],
            correctActions: [
              'Завершите разговор',
              'Проверьте информацию через надежные источники',
              'Свяжитесь с родственником или его близкими',
              'Не переводите деньги без подтверждения'
            ]
          }
        ]
      },
      {
        id: 3,
        title: '"Привяжите карту к аккаунту"',
        text: 'Вам приходит письмо: "Ваш аккаунт будет заблокирован, если не привяжете карту в течение 24 часов. Перейдите по ссылке и введите данные карты."',
        responses: [
          {
            text: 'Перейти по ссылке и ввести данные',
            correct: false,
            explanation: 'Это фишинг! Никогда не переходите по ссылкам из подозрительных писем и не вводите данные карты.',
            redFlags: [
              'Угроза блокировки аккаунта',
              'Срочность (24 часа)',
              'Ссылка в письме (может вести на поддельный сайт)',
              'Запрос данных карты по email'
            ],
            correctActions: [
              'Не переходите по ссылке',
              'Войдите в аккаунт напрямую через официальный сайт',
              'Проверьте настройки безопасности',
              'Сообщите о подозрительном письме'
            ]
          },
          {
            text: 'Проверить аккаунт напрямую через официальный сайт',
            correct: true,
            explanation: 'Правильно! Всегда входите в аккаунт напрямую, не переходя по ссылкам из писем.',
            redFlags: [
              'Настоящие сервисы не требуют привязки карты под угрозой блокировки',
              'Проверьте отправителя письма'
            ],
            correctActions: [
              'Войдите в аккаунт через официальный сайт',
              'Проверьте настройки безопасности',
              'Если нужно привязать карту, делайте это через официальный интерфейс',
              'Проверьте адрес отправителя письма'
            ]
          },
          {
            text: 'Игнорировать письмо и проверить аккаунт',
            correct: true,
            explanation: 'Отлично! Игнорирование подозрительных писем и проверка аккаунта напрямую — правильная стратегия.',
            redFlags: [
              'Подозрительные письма часто содержат угрозы',
              'Настоящие уведомления приходят через официальные каналы'
            ],
            correctActions: [
              'Игнорируйте подозрительные письма',
              'Войдите в аккаунт напрямую',
              'Проверьте настройки уведомлений',
              'Сообщите о фишинге, если это возможно'
            ]
          }
        ]
      }
    ];

    let currentScenario = 0;

    function loadScenario(index) {
      const scenario = scenarios[index];
      const container = document.getElementById('scenarioContainer');
      
      container.innerHTML = `
        <div class="scenario-card">
          <h2>Сценарий ${scenario.id}: ${scenario.title}</h2>
          <div class="scenario-text">${scenario.text}</div>
          
          <h3 style="margin-bottom: 16px; color: var(--text);">Как вы поступите?</h3>
          <div class="responses-grid">
            ${scenario.responses.map((response, i) => `
              <button class="response-btn" onclick="selectResponse(${i})">
                ${response.text}
              </button>
            `).join('')}
          </div>
        </div>
        
        <div class="result-section" id="resultSection"></div>
      `;
    }

    function selectResponse(responseIndex) {
      const scenario = scenarios[currentScenario];
      const response = scenario.responses[responseIndex];
      const resultSection = document.getElementById('resultSection');
      
      resultSection.innerHTML = `
        <div class="result-card ${response.correct ? 'correct' : 'incorrect'}">
          <h3>
            ${response.correct ? '✅ Правильно!' : '❌ Опасно!'}
            ${response.correct ? 'Вы правильно определили угрозу' : 'Это могло бы привести к потере данных или денег'}
          </h3>
          <p><strong>Объяснение:</strong> ${response.explanation}</p>
          
          <div class="red-flags">
            <h4>🚩 Признаки мошенничества:</h4>
            <ul>
              ${response.redFlags.map(flag => `<li>${flag}</li>`).join('')}
            </ul>
          </div>
          
          <div class="correct-actions">
            <h4>✅ Правильные действия:</h4>
            <ul>
              ${response.correctActions.map(action => `<li>${action}</li>`).join('')}
            </ul>
          </div>
        </div>
        
        ${currentScenario < scenarios.length - 1 ? `
          <button class="btn-next" onclick="nextScenario()">Следующий сценарий →</button>
        ` : `
          <div class="result-card correct">
            <h3>🎉 Вы прошли все сценарии!</h3>
            <p>Теперь вы знаете основные признаки социальной инженерии и как защититься от них.</p>
            <button class="btn-next" onclick="restart()">Начать заново</button>
          </div>
        `}
      `;
      
      resultSection.classList.add('visible');
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function nextScenario() {
      currentScenario++;
      loadScenario(currentScenario);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function restart() {
      currentScenario = 0;
      loadScenario(0);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Load first scenario
    loadScenario(0);
  </script>
</body>
</html>
